# config.toml — effects for ~/.config/screensaver/screensaver.
#
# Only cmatrix is enabled right now. To rotate through several again, uncomment
# their blocks below; enabled effects take turns in random order. Any whose
# program isn't installed is skipped without complaint, so install one later and
# it simply joins the rotation. Check what's live with:
#   ~/.config/screensaver/screensaver list

# How long one effect runs before the next takes over. Rotating is burn-in
# protection in itself: nothing gets to sit in the same place for long.
rotate_seconds = 180

# After a start from the power menu, input is ignored for this long, so the
# click that launched it doesn't close it again straight away.
grace_seconds = 1.5

[terminal]
font_size = 13.0
# On OLED a black pixel is a pixel that's switched off. Keep this #000000.
background = "#000000"
foreground = "#9aa5ce"

[[effect]]
# Matrix rain in a dim blue rather than the default searing green, across the
# whole screen. As the only effect it runs uninterrupted, never restarted.
name = "matrix"
command = ["cmatrix", "-b", "-a", "-u", "5", "-C", "blue"]

