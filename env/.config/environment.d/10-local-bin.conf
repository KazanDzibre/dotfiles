# Put ~/.local/bin on the PATH of the whole graphical session.
#
# Ubuntu adds it in ~/.profile, which works under GNOME because GDM's GNOME
# session goes through a login shell. It does NOT work under Hyprland:
# /usr/bin/start-hyprland is a compiled binary, so nothing ever reads
# ~/.profile, and everything Hyprland spawns -- terminals included -- inherits a
# PATH without it.
#
# The symptom is a command that "works in GNOME but not in Hyprland": claude,
# wal, waypaper and ptyxis-theme.sh all live there.
#
# systemd's user manager reads this directory and applies it to the session, so
# it fixes exec-once, keybinds and terminals in one place, for any compositor.
# It is read at session start -- log out and back in after changing it, or run
#   systemctl --user import-environment PATH
# to patch the running session.
PATH=$HOME/.local/bin:$PATH
