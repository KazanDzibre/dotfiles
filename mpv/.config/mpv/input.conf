# Additions on top of mpv's default keys (mpv --input-keylist / man mpv).

# uosc: right click (or the menu key) opens its menu; o opens a file.
MBTN_RIGHT  script-binding uosc/menu
MENU        script-binding uosc/menu
o           script-binding uosc/open-file
p           script-binding uosc/items
c           script-binding uosc/chapters

# Scroll: volume, not seek.
WHEEL_UP    add volume 5
WHEEL_DOWN  add volume -5

# Arrows: 5s / 30s, exact.
RIGHT  seek  5 exact
LEFT   seek -5 exact
UP     seek  30 exact
DOWN   seek -30 exact

# Speed back to normal.
BS  set speed 1.0

# Subtitle and audio track pickers.
s  script-binding uosc/subtitles
a  script-binding uosc/audio
# Screenshot with and without subtitles (s is taken above).
Ctrl+s  screenshot
Ctrl+S  screenshot video

# Playback stats.
TAB  script-binding stats/display-stats-toggle
