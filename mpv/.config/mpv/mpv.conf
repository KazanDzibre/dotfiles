# mpv — shared by both laptops (stow -t ~ mpv). Works on mpv 0.37+.
#
# The player UI is uosc (bootstrap/install-mpv-ui.sh installs it and
# thumbfast, the seek bar previews); its settings are script-opts/uosc.conf.

# ---- UI: uosc replaces mpv's own controls and OSD bars
osc=no
osd-bar=no
# The colours for the current wallpaper (theme-sync writes this).
include=~/.cache/wal/mpv.conf

# ---- Video
profile=high-quality
vo=gpu-next
# Hardware decoding where it's known to be safe (Intel here, whatever the other
# laptop has); mpv falls back to software on its own.
hwdec=auto-safe
video-sync=display-resample
interpolation=no

# ---- Window
keep-open=yes
autofit-larger=85%x85%
force-window=immediate
cursor-autohide=1000

# ---- Resume where you left off
save-position-on-quit=yes
# Kept out of ~/.config/mpv, which is a link into the dotfiles repo.
watch-later-dir=~/.local/state/mpv/watch_later
watch-later-options-remove=pause

# ---- Audio
volume=80
volume-max=150
audio-file-auto=fuzzy
alang=en,eng,sr,srp,hr,hrv

# ---- Subtitles
slang=en,eng,sr,srp,hr,hrv
sub-auto=fuzzy
sub-font="Inter"
sub-bold=yes
sub-font-size=42
sub-border-size=2.5
sub-shadow-offset=1
sub-shadow-color="#80000000"
sub-margin-y=40

# ---- On-screen display
osd-font="Inter"
osd-font-size=30
osd-bar-h=2
osd-border-size=1.5
osd-duration=1200
osd-playing-msg="${media-title}"
osd-playing-msg-duration=1500

# ---- Screenshots (s / S)
screenshot-format=png
screenshot-dir=~/Pictures/Screenshots
screenshot-template="mpv-%F-%wH.%wM.%wS"

# ---- Online video (needs yt-dlp)
ytdl-format=bestvideo[height<=?1080]+bestaudio/best
