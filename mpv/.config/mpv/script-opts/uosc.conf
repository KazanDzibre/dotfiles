# uosc — the player UI (installed by bootstrap/install-mpv-ui.sh).
# Only what differs from uosc's defaults; the full list with comments is in
# uosc's own uosc.conf (github.com/tomasklaen/uosc).
#
# Colours are not set here: theme-sync writes them to ~/.cache/wal/mpv.conf on
# every wallpaper change (black, the wallpaper accent), and mpv.conf includes it.

# Rounder, like the island.
border_radius=10
# Opening a file queues the rest of its folder (next/prev, the playlist).
autoload=yes
# Bold text: reads better over bright video.
font_bold=yes
# Timeline: a thin line while watching, a bar when the mouse comes near.
timeline_style=line
timeline_line_width=2
timeline_size=36
