# Bluetooth headphones: let PipeWire do the volume itself instead of handing it
# to the headphones ("hardware volume", AVRCP).
#
# With hardware volume on, Quickshell's volume controls (the island, the
# control center) moved a number the earbuds never applied: the earbuds stayed
# at full volume whatever the bar did. With it off, the bar, the volume keys
# and every app all change the same, real volume. Set the earbuds' own volume
# to maximum once; from then on it's all controlled from here.
monitor.bluez.properties = {
  bluez5.enable-hw-volume = false
}
