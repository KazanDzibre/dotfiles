<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Text rendering for both laptops, and Inter as the interface font.

  The screens are scaled (1.5x here), so subpixel (coloured) antialiasing
  only adds fringes: plain greyscale with light hinting keeps letter shapes
  true and edges even. Inter itself is installed by bootstrap/install-font.sh,
  which also sets it for GTK and Qt/KDE apps; the bar keeps its own font.
-->
<fontconfig>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>

  <!-- Anything that just asks for "sans-serif" or the system UI font. -->
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias binding="same">
    <family>system-ui</family>
    <prefer><family>Inter</family></prefer>
  </alias>
</fontconfig>
