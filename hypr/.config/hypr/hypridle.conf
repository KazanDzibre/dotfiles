# hypridle.conf — turns the panel off after 10 minutes idle.
#
# The screensaver is deliberately NOT on a timer: a full-screen animation was
# costing too much while working, so it only starts from the Quickshell power
# menu now. Adding a `listener` here whose on-timeout runs
# `screensaver start` is all it would take to bring the idle start back — the
# power menu reads this file and will say so by itself.
#
# "Idle" here respects inhibitors, and that is what makes the Quickshell
# keep-awake toggle work: while it's on, the bar holds a Wayland idle inhibitor,
# so the listener below never fires. Browsers and video players take the same
# kind of inhibitor while something is playing, so a film won't be cut short.

general {
    ignore_dbus_inhibit = false      # apps asking over D-Bus (Chromium, Steam, …)
    ignore_systemd_inhibit = false
    ignore_wayland_inhibit = false   # keep awake, and fullscreen video
}

# Switching the panel off is the one thing better than black for an OLED. This
# also closes a screensaver started by hand, if one is still up.
listener {
    timeout = 600
    on-timeout = ~/.config/screensaver/screensaver stop; hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
