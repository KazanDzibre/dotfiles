# hypridle.conf — screensaver after 3 minutes idle, panel off after 10 minutes.
#
# "Idle" here respects inhibitors, and that is what makes the Quickshell
# keep-awake toggle work: while it's on, the bar holds a Wayland idle inhibitor,
# so neither listener below ever fires. Browsers and video players take the same
# kind of inhibitor while something is actually playing, so a film won't be
# interrupted either.

general {
    ignore_dbus_inhibit = false      # apps asking over D-Bus (Chromium, Steam, …)
    ignore_systemd_inhibit = false
    ignore_wayland_inhibit = false   # keep awake, and fullscreen video
}

# The screensaver. Any key or mouse movement ends it — the screensaver exits on
# input by itself, and on-resume is the belt to that brace.
listener {
    timeout = 180
    on-timeout = ~/.config/screensaver/screensaver start
    on-resume = ~/.config/screensaver/screensaver stop
}

# Past this there is nothing worth animating: switch the panel off outright,
# which is the only thing better than black for an OLED.
listener {
    timeout = 600
    on-timeout = ~/.config/screensaver/screensaver stop; hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
