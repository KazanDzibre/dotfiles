# ~/.config/hypr/hyprlock.conf — the lock screen, in the bar's style: the
# wallpaper blurred and darkened, a big clock, and a black pill for the
# password like the island. Colours and the wallpaper come from theme-sync.

# $accent, $surface, $text, $dim, $base and $wallpaper: from theme-sync.
# Defaults first: hyprlang treats a `source` of a missing file as an error, and
# theme-sync may never have run. Same trick as hyprland.conf's $wal_* block.
$accent = rgb(89b4fa)
$surface = rgb(1e1e2e)
$text = rgb(cdd6f4)
$dim = rgb(6c7086)
$base = rgb(11111b)
$wallpaper = screenshot
source = ~/.cache/wal/hyprlock-colors.conf

# The bar's font (Theme.qml), so the lock screen reads like the rest.
$font = FantasqueSansM Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true

    # `grace`, `no_fade_in` and `disable_loading` are NOT config keys in this
    # hyprlock (0.9.2, Ubuntu 26.04) -- setting them is a config error and the
    # whole general block gets rejected. Checked with:
    #   strings /usr/bin/hyprlock | grep -x 'general:grace'
    # grace is a command-line option here, so it is passed where hyprlock is
    # actually launched: the SUPER+SHIFT+X bind in hyprland.conf and hypridle's
    # lock_cmd. It was 0 before, which is the default anyway.
}

# Fingerprint unlock goes through fprintd over D-Bus (package: fprintd), not
# PAM. Password still works at the same time. Enrol with `fprintd-enroll`.
# Keys verified with: strings /usr/bin/hyprlock | grep auth:fingerprint
auth {
    fingerprint:enabled = true
}

# Things arrive the way the bar's panels do: a quick fade, nothing flashy.
animations {
    enabled = true
    bezier = soft, 0.2, 0.8, 0.2, 1
    animation = fadeIn, 1, 4, soft
    animation = fadeOut, 1, 4, soft
    animation = inputFieldColors, 1, 3, soft
    animation = inputFieldWidth, 1, 3, soft
    animation = inputFieldDots, 1, 2, soft
}

# --------------------------------------------------------------- background
background {
    monitor =
    path = $wallpaper
    color = $base
    blur_passes = 3
    blur_size = 8
    noise = 0.01
    contrast = 0.9
    brightness = 0.55
    vibrancy = 0.17
    vibrancy_darkness = 0.0
}

# -------------------------------------------------------------------- clock
label {
    monitor =
    text = $TIME
    color = $text
    font_size = 104
    font_family = $font Bold
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.45)
    position = 0, 170
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = $dim
    font_size = 20
    font_family = $font
    shadow_passes = 1
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.4)
    position = 0, 80
    halign = center
    valign = center
}

# ----------------------------------------------------------------- password
# A black pill like the island; the outline takes the accent while you type,
# turns red on a wrong password and amber with Caps Lock on.
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.12)
    inner_color = rgba(5, 4, 3, 0.86)
    font_color = $text
    font_family = $font
    check_color = $accent
    fail_color = rgb(f0808f)
    capslock_color = rgb(f0c674)
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffff99">Password</span>
    fail_text = $FAIL
    hide_input = false
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.35)
    position = 0, -40
    halign = center
    valign = center
}

# "Touch the sensor", and why a touch didn't work.
label {
    monitor =
    text = $FPRINTPROMPT
    color = $dim
    font_size = 13
    font_family = $font
    position = 0, -100
    halign = center
    valign = center
}

# -------------------------------------------------------------- small extras
# What's playing, at the bottom. Escaped, because labels are Pango markup and a
# title with "&" in it would otherwise blank the line.
# The trailing `grep . || printf ' '` matters on hyprlock 0.9 (Ubuntu): a label
# whose command prints nothing shows the placeholder "Sample Text" instead of
# staying blank, so an empty result is turned into a single space.
label {
    monitor =
    text = cmd[update:2000] playerctl -a metadata --format '{{status}}|{{artist}} · {{title}}' 2>/dev/null | grep -m1 '^Playing|' | cut -d'|' -f2- | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/^/󰝚  /' | grep . || printf ' '
    color = $dim
    font_size = 13
    font_family = $font
    position = 0, 48
    halign = center
    valign = bottom
}

# Battery, top right; nothing on a machine without one. No `$` in the
# command: hyprlang would try to expand it as one of its own variables.
label {
    monitor =
    text = cmd[update:30000] cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1 | sed 's/.*/󰁹  &%/' | grep . || printf ' '
    color = $dim
    font_size = 13
    font_family = $font
    position = -36, -28
    halign = right
    valign = top
}
