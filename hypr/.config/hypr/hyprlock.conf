# ~/.config/hypr/hyprlock.conf

# $accent, $surface, $text, $dim, $base: the wallpaper's palette, from theme-sync.
source = ~/.cache/wal/hyprlock-colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true

    # `grace`, `no_fade_in` and `disable_loading` are NOT config keys in this
    # hyprlock (0.9.2, Ubuntu 26.04) -- setting them is a config error and the
    # whole general block gets rejected. Checked with:
    #   strings /usr/bin/hyprlock | grep -x 'general:grace'
    # grace is a command-line option here, so it is passed where hyprlock is
    # actually launched: the SUPER+SHIFT+X bind in hyprland.conf and hypridle's
    # lock_cmd. It was 0 before, which is the default anyway.
}

background {
    monitor =
    path = screenshot # This takes a live 'snapshot' of your desktop
    color = $base
    blur_passes = 3 # 0 disables blurring
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    outer_color = $accent
    inner_color = $surface
    font_color = $text
    fade_on_empty = true
    placeholder_text = <i>Input Password...</i>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = $text
    font_size = 64
    font_family = monospace
    position = 0, 80
    halign = center
    valign = center
}
