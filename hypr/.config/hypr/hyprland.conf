# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# EDIT THIS CONFIG ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################



# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hypr.land/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
# This laptop is a 1920x1200 panel. Scale 1.5 leaves 1280x800 logical pixels,
# which is what every dimension in the bar's Theme.qml was tuned against -- a
# 34px bar and 26px islands are deliberately compact because there isn't much
# room. `auto` picks scale 1 here, which makes the bar look undersized.
monitor = eDP-1, 1920x1200@60, 0x0, 1.5
# Anything plugged in later.
monitor = , preferred, auto, 1.5


###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
# What is actually installed here. alacritty, dolphin and wofi are not:
#   terminal    ptyxis, themed from the pywal palette (ptyxis/.local/bin)
#   files       nautilus, the GNOME one Ubuntu ships
#   menu        rofi -- and this repo carries a pywal-themed rofi config
#               (rofi/.config/rofi), which wofi could not use anyway.
# `wofi` not being installed is why SUPER+SHIFT+D appeared to do nothing.
# --new-window is load-bearing. Ptyxis is a single-instance GTK app: a bare
# `ptyxis` when one is already running just re-activates the existing instance,
# which looks like the key doing nothing at all. --new-window asks that instance
# for a real second window.
$terminal = ptyxis --new-window
$fileManager = nautilus
$menu = rofi -show drun

#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# hyprpaper and hypridle ARE started here, despite Ubuntu shipping enabled
# systemd user units for both.
#
# Those units are `WantedBy=graphical-session.target`, and that target is never
# reached in a GDM-launched Hyprland session -- there is no systemd session
# integration (no uwsm), so the units sit `enabled` but `inactive` forever:
#   systemctl --user is-active graphical-session.target   ->  inactive
# Relying on them meant no wallpaper after a reboot and no idle/screensaver at
# all. The units are disabled (`systemctl --user disable hyprpaper hypridle`)
# so they can never race with these lines if that ever changes.

# wal-hypr.sh is not used: it sources ~/.cache/wal/colors.sh into a subshell
# that then exits, so it has no effect on Hyprland. Border colours come from
# the `source` line in the LOOK AND FEEL section instead, which does work.
# exec-once = ~/.config/hypr/wal-hypr.sh

# exec-once = eww daemon && eww open bar
# Guarded, because both units are enabled in GLOBAL systemd scope -- a user-scope
# `disable` does not stick. Today they never fire (the target they want is never
# reached), but if that ever changes these will not start a second copy.
exec-once = sh -c 'pgrep -x hyprpaper >/dev/null || exec hyprpaper'
exec-once = sh -c 'pgrep -x hypridle  >/dev/null || exec hypridle'
exec-once = quickshell

# The wallpaper, restored by our own script rather than `waypaper --restore`.
# waypaper's retry loop only sleeps on success, so at boot -- before hyprpaper's
# socket is listening -- all ten attempts fail within milliseconds and it gives
# up silently. That was the "wallpaper sometimes doesn't apply" bug. The script
# retries with a real delay; see its header. waypaper is still the picker.
exec-once = $HOME/.config/waypaper/wallpaper_restore.sh

# Clipboard history for the bar's SUPER+SHIFT+V popup. Must be running before
# anything is copied, or the history starts empty.
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# A polkit agent, so anything asking for authentication gets a dialog instead
# of failing silently. Ubuntu has no polkit-gnome package (that agent is built
# into gnome-shell); this is mate-polkit, a plain GTK one.
exec-once = /usr/libexec/polkit-mate-authentication-agent-1

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar 


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,14
env = HYPRCURSOR_SIZE,14

# ~/.local/bin on PATH for everything Hyprland starts, terminals included.
#
# It is not there otherwise: /usr/bin/start-hyprland is a compiled binary, so
# ~/.profile (where Ubuntu adds it) is never sourced, and env/.config/
# environment.d only reaches services started BY the systemd user manager --
# a GDM-launched Hyprland is not one of those. This line is what actually makes
# `claude`, `wal` and `waypaper` resolve in a new terminal.
#
# Hyprland expands both $HOME and $PATH here; verified with
#   hyprctl keyword env QSTEST,$HOME/.local/bin:$PATH
# which came back fully expanded.
env = PATH,$HOME/.local/bin:$PATH


###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# Border colours follow the wallpaper. waypaper's hook regenerates this file on
# every wallpaper change, using the SAME accent-scoring Theme.qml uses, so the
# borders and the bar never disagree.
#
# The defaults are declared FIRST because a `source` of a missing file is a hard
# error in hyprlang -- on a machine where `wal` has never run, this is what
# keeps the config loading. They match Theme.qml's Catppuccin fallbacks.
$wal_accent = rgb(89b4fa)
$wal_dim    = rgb(6c7086)
$wal_bg     = rgb(11111b)
source = ~/.cache/wal/colors-hyprland.conf

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 2 
    gaps_out = 2 
    border_size = 1 
    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = $wal_accent
    col.inactive_border = $wal_dim
    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false
    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false
    layout = master 
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 5 
    rounding_power = 2 

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1
    # A little past the target and back — gives the AI panel a physical settle
    # instead of a dead stop.
    bezier = overshoot,      0.05, 0.9,  0.1,  1.08

    # Default animations, see https://wiki.hypr.land/Configuring/Animations/
    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick

    # The AI assistant (special:ai, see the window rule further down) is docked
    # to the left edge, so it slides in off that edge rather than fading in
    # place — it reads as a drawer instead of an apparition. These inherit from
    # `workspaces` unless set, which is why the panel used to just fade.
    #
    # `slidefade` slides horizontally; swap both to `slidefadevert` if you would
    # rather it drop down from the top. The percentage is how much of the
    # travel is spent moving vs. fading.
    animation = specialWorkspaceIn,  1, 3.4, overshoot,     slidefade 25%
    animation = specialWorkspaceOut, 1, 2.6, easeInOutCubic, slidefade 25%
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule {
#     name = no-gaps-wtv1
#     match:float = false
#     match:workspace = w[tv1]
#
#     border_size = 0
#     rounding = 0
# }
#
# windowrule {
#     name = no-gaps-f1
#     match:float = false
#     match:workspace = f[1]
#
#     border_size = 0
#     rounding = 0
# }

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
# dwindle {
#     pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
#     preserve_split = true # You probably want this
# }

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = slave 
    orientation = left 
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    # 0, not -1: the wallpaper is waypaper's job, and Hyprland's own default
    # gets drawn over it on every reload otherwise.
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 0 

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod SHIFT, Q, killactive,
bind = $mainMod SHIFT, E, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, V, togglefloating,
bind = $mainMod SHIFT, D, exec, $menu
# rustystore: pick a key in rofi, its value is copied to the clipboard.
# Installed by ~/Nuketown/rustystore/install.sh.
bind = $mainMod, P, exec, $HOME/.local/bin/rustystore-rofi
bind = $mainMod, F, fullscreen, 1
bind = $mainMod SHIFT, F, fullscreen, 0 
bind = $mainMod SHIFT, R, exec, hyprctl reload 
bind = $mainMod SHIFT, X, exec, hyprlock

# Sway-style tabbed workspace. SUPER+W stacks every tiled window on the
# workspace into one tabbed group; SUPER+E dissolves it back to tiling; SUPER+h/l
# walk the tabs (see binds:movefocus_cycles_groupfirst below). Hyprland has no
# tabbed/stacking layout, only groups -- the script explains how it builds one.
bind = $mainMod, W, exec, $HOME/.local/bin/hypr-stack.sh on
bind = $mainMod, E, exec, $HOME/.local/bin/hypr-stack.sh off
# Every bind, read from the compositor itself and shown in rofi.
bind = $mainMod, slash, exec, $HOME/.local/bin/hypr-keys.sh

# bind = $mainMod, J, layoutmsg, togglesplit # dwindle

# Move focus with mainMod + arrow keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, j, movefocus, d
bind = $mainMod, k, movefocus, u
bind = $mainMod, l, movefocus, r 

# Move WINDOWS with mainMod + SHIFT + h/j/k/l
# h/l are context-aware since the tabbed workspace (SUPER+W) was added: inside
# a tab group they move the current tab left/right, like sway; anywhere else
# they still swap with master / swap with next, exactly as before. Hyprland
# binds cannot branch on state, so hypr-stack.sh does the branching.
bind = $mainMod SHIFT, h, exec, $HOME/.local/bin/hypr-stack.sh move l   # tab left  | else swapwithmaster
bind = $mainMod SHIFT, l, exec, $HOME/.local/bin/hypr-stack.sh move r   # tab right | else swapnext
bind = $mainMod SHIFT, j, layoutmsg, swapnext           # Move window down in stack
bind = $mainMod SHIFT, k, layoutmsg, swapprev           # Move window up in stack

# Switch workspaces with mainMod + [0-9]
# NOTE: Hyprland matches keysyms case-insensitively, so `$mainMod, m` and
# `$mainMod, M` are the SAME bind -- both register but only the first declared
# is reachable. swapwithmaster was on M and silently shadowed by this one, so it
# has moved to SUPER+SHIFT+RETURN (the usual place for it in master layouts).
bind = $mainMod, m, workspace, 11 
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, m, movetoworkspace, 11
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod SHIFT, RETURN, layoutmsg, swapwithmaster

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

#TODO need to work on this to make it user friendly
# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Quickshell tools. These are global shortcuts the bar registers itself, so
# they do nothing if quickshell isn't running (rather than launching anything).
# SUPER+V and SUPER+SHIFT+S are already taken by togglefloating and the magic
# workspace, hence the SHIFT variants here.
bind = , Print, global, quickshell:screenshotRegion
bind = SHIFT, Print, global, quickshell:screenshotScreen
bind = $mainMod SHIFT, V, global, quickshell:clipboard
bind = $mainMod SHIFT, A, global, quickshell:keepAwake

# SUPER+h/l walk a group's tabs before leaving it, the way focus moves through
# a tabbed container in sway. Without this, movefocus jumps straight past the
# group to the next window and the only way between tabs is a separate key.
binds {
    movefocus_cycles_groupfirst = true
}

# Groups (the tabbed workspace from SUPER+W), coloured from the wallpaper like
# the window borders. $wal_accent/$wal_dim are defined in LOOK AND FEEL.
group {
    col.border_active = $wal_accent
    col.border_inactive = $wal_dim

    groupbar {
        height = 16
        font_size = 11
        gradients = false
        col.active = $wal_accent
        col.inactive = $wal_dim
    }
}

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrules that are useful

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

# AI assistant sidebar, toggled from the Quickshell bar (AiAssistant.qml).
# It parks on the special:ai workspace so one dispatch slides it in and out.
#
# Chromium ignores --class in --app mode and derives its Wayland app id from the
# URL (chrome-www.kimi.com__-Default), so this matches the prefix every Chromium
# web app shares. That means changing QS_AI_URL is enough to swap assistants —
# nothing here needs editing. Narrow the match if you ever run a second one.
windowrule {
    name = ai-assistant

    match:class = chrome-.*

    float = yes
    size = 460 748
    move = 8 42
    workspace = special:ai silent

    # It is docked to the left edge, so it should arrive from the left. Hyprland
    # picks the direction itself for special-workspace animations, which is why
    # this is set per-window. If it still enters from the wrong side, the other
    # lever is the specialWorkspaceIn/Out style above.
    animation = slide left
}

# Screensaver (~/.config/screensaver), started by hypridle and by the Quickshell
# power menu. Fullscreen so it covers the bar as well; no open animation, border
# or rounding, so it's black edge to edge from the first frame.
windowrule {
    name = screensaver

    match:class = ^screensaver$

    fullscreen = yes
    no_anim = yes
    no_blur = yes
    no_shadow = yes
    border_size = 0
    rounding = 0
}

xwayland {
  force_zero_scaling = true
}
