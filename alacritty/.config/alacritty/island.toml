# The island terminal (Super+`, hypr/.local/bin/island-term): everything from
# alacritty.toml, but solid black like the Dynamic Island and its cards, so
# the island can hand over to it without a seam.

[general]
import = ["~/.config/alacritty/alacritty.toml"]

# fish, like your other terminals (Alacritty's default is $SHELL, which
# isn't fish in every session).
[terminal.shell]
program = "fish"

[window]
opacity = 1.0
padding = { x = 20, y = 14 }
dynamic_padding = false

# The island's own black (DynamicIsland.qml, the shape's colour).
[colors.primary]
background = "#050403"
